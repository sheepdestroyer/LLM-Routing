{% for t in data.tool_tokens %}
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px;">
        <span style="width: 12px; height: 12px; border-radius: 50%; background: {{ t.color }}; display: inline-block; box-shadow: 0 0 6px {{ t.color }}aa;"></span>
        <span style="text-transform: capitalize; font-weight: 600;">{{ t.name }}:</span>
        <span style="opacity: 0.7;">{{ "%.1f"|format(t.overall_pct) }}%</span>
    </div>
    {% endfor %}
