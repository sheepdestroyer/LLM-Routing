<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Beautiful modern purple-to-indigo gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <!-- Background subtle dark gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <!-- Drop shadow filter for the glowing center -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer glassmorphic glowing border -->
  <circle cx="16" cy="16" r="14" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="1.5" />

  <!-- Stylized "A" (Antigravity) and Routing Nodes -->
  <g filter="url(#glow)">
    <!-- Main stylized chevron/A -->
    <path d="M 16 7 L 22 19 L 18.5 19 L 16 14 L 13.5 19 L 10 19 Z" fill="url(#glowGrad)" />
    <!-- Center floating triage node/dot -->
    <circle cx="16" cy="19.5" r="2.2" fill="#f8fafc" />
    <circle cx="16" cy="19.5" r="1.5" fill="#a78bfa" />
  </g>
</svg>
