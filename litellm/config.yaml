general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
litellm_settings:
  # -------------------------------------------------------------------------
  # FALLBACK CHAINS (cascading, in order of escalation)
  # Simple → medium → complex → reasoning → advanced → local-qwen → ollama → openrouter-auto
  # Static entries chain-route upward — only advanced-core hits local-qwen directly.
  # When one tier fails, LiteLLM tries the next model in the chain.
  # Static safety-net entries in model_list (local-qwen per tier) guarantee
  # each agent tier has at least one deployment even during OpenRouter outages.
  # -------------------------------------------------------------------------
  cache: true
  cache_params:
    host: 127.0.0.1
    mode: default
    port: VALKEY_CACHE_PORT_PLACEHOLDER
    ttl: 3600
    type: redis
  caching_backend: redis
  callbacks:
  - langfuse
  detailed_debug: false
  drop_params: true
  public_model_groups:
    - openrouter-auto
    - openrouter-gpt-5.6-luna
    - openrouter-gpt-5.6-luna-max
    - gpt-5.6-luna
    - llm-routing-ollama
    - ollama-deepseek-v4-pro
    - ollama-deepseek-v4-flash
    - "ollama/GPT-5.6 Luna (max)"
    - ollama-gpt-5.6-luna-max
    - "ollama/gpt-5.6-luna"
    - ollama-gpt-5.6-luna
    - agent-advanced-core
    - agent-reasoning-core
    - agent-complex-core
    - agent-medium-core
    - agent-simple-core
    - whisper-1
    - gpt-4o-mini-transcribe
    - gpt-4o-mini-tts
    - tts-1
    - local-qwen
    - local-qwen-hass
    - local-qwen-routing
    - gpt-4o-mini
    - gpt-4o
    - llm-routing-agy
    - agy-gemini
    - agy-opus
  fallbacks:
  - llm-routing-agy:
    - agy-opus
    - agent-advanced-core
    - llm-routing-ollama
    - openrouter-auto
  - agy-gemini:
    - agy-opus
    - agent-advanced-core
    - llm-routing-ollama
    - openrouter-auto
  - agy-opus:
    - agent-advanced-core
    - llm-routing-ollama
    - openrouter-auto
  - agent-simple-core:
    - agent-medium-core
    - agent-complex-core
    - agent-reasoning-core
    - agent-advanced-core
    - llm-routing-ollama
    - openrouter-auto
  - agent-medium-core:
    - agent-complex-core
    - agent-reasoning-core
    - agent-advanced-core
    - llm-routing-ollama
    - openrouter-auto
  - agent-complex-core:
    - agent-reasoning-core
    - agent-advanced-core
    - llm-routing-ollama
    - openrouter-auto
  - agent-reasoning-core:
    - agent-advanced-core
    - llm-routing-ollama
    - openrouter-auto
  - agent-advanced-core:
    - local-qwen
    - llm-routing-ollama
    - openrouter-auto

