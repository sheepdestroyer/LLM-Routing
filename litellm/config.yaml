- litellm_params:
    api_base: STRATA_SERVER_URL_PLACEHOLDER
    api_key: local-token
    model: openai/strata-qwen
    request_timeout: 600
    # Streaming clients (Hermes) give up on a dead GX10 after 120 s between chunks/connect
    # instead of the 600 s non-streaming budget.
    stream_timeout: 120
  model_name: strata-qwen
  model_info:
    supports_vision: true
    supports_reasoning: true
    supports_function_calling: true
    mode: chat
    max_tokens: 262144
    max_input_tokens: 262144
    is_public_model_group: true
    # Deployment-level cooldown override (router-wide allowed_fails: 0 / cooldown_time: 300
    # put strata-qwen in a 300 s cooldown after a single connection error on 2026-10-23,
    # answering every retry with 429 "No deployments available"). Tolerate one failure so the
    # retry policy below gets a real second attempt, then cool down briefly and let the
    # local fallback (locallama-qwen) answer.
    allowed_fails_policy:
      InternalServerErrorAllowedFails: 1
      TimeoutErrorAllowedFails: 1
      RateLimitErrorAllowedFails: 1
    cooldown_time: 60

- litellm_params:
    api_base: STRATA_SERVER_URL_PLACEHOLDER
    api_key: local-token
    # Every GX10 deployment sends the one served name: Basalt accepts a single model name.
    model: openai/strata-qwen
    request_timeout: 600
  model_name: locallama-strata
  model_info:
    supports_vision: true
    supports_reasoning: true
    supports_function_calling: true
    mode: chat
    max_tokens: 262144
    max_input_tokens: 262144
    is_public_model_group: true

- litellm_params:
    api_base: STRATA_SERVER_URL_PLACEHOLDER
    api_key: local-token
    model: openai/strata-qwen
    request_timeout: 600
  model_name: gb10-strata
  model_info:
    # gb10-strata has no fallback: callers that must reach Strata alone (e.g. a two-reader
    # comparison whose other reader is the local model) use it.
    supports_vision: true
    supports_reasoning: true
    supports_function_calling: true
    mode: chat
    max_tokens: 262144
    max_input_tokens: 262144
    is_public_model_group: true

- litellm_params:
    api_base: STRATA_SERVER_URL_PLACEHOLDER
    api_key: local-token
    # The GX10 engine (Strata or Basalt) is always asked for its served name, strata-qwen.
    model: openai/strata-qwen
    # A page takes ~30-45 s on Strata (up to ~300 s with hidden reasoning, ~480 s when both
    # Strata slots are busy). 500 s leaves the local fallback, which reads with thinking on since
    # 2026-11-09 (TASK-353: 24 s/page median, 87 s at most), time to answer inside the 600 s
    # client budget of the DIVORCE-IA page reader (540 s did with thinking off: 14 s/page median, 28 s at most).
    request_timeout: 500
  model_name: strata-qwen-vl
  model_info:
    supports_vision: true
    supports_reasoning: true
    supports_function_calling: true
    mode: chat
    max_tokens: 262144
    max_input_tokens: 262144
    is_public_model_group: true
    # Same deployment-level override as strata-qwen (section 9g of the manual): one failure does
    # not cool Strata down, so the retry is a real second attempt; then 60 s on the local fallback.
    allowed_fails_policy:
      InternalServerErrorAllowedFails: 1
      TimeoutErrorAllowedFails: 1
      RateLimitErrorAllowedFails: 1
    cooldown_time: 60

redis_settings:
  redis_host: 127.0.0.1
  redis_port: VALKEY_CACHE_PORT_PLACEHOLDER
router_settings:
  allowed_fails: 0
  cooldown_time: 300
  enable_pre_call_checks: false
  num_retries: 1
  # strata-qwen: retry connection errors / 5xx / timeouts (exponential backoff 0.5 s, 1 s, ...
  # for single-deployment groups) before the locallama-qwen fallback; never retry 4xx.
  model_group_retry_policy:
    strata-qwen:
      InternalServerErrorRetries: 2
      ServiceUnavailableErrorRetries: 2
      TimeoutErrorRetries: 1
      RateLimitErrorRetries: 1
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
      NotFoundErrorRetries: 0
      DefaultRetries: 1
    # strata-qwen-vl: retry a connection error / 5xx once, never a timeout (a page that ran 500 s
    # would run as long again); then the locallama-qwen-vl fallback.
    strata-qwen-vl:
      InternalServerErrorRetries: 1
      ServiceUnavailableErrorRetries: 1
      TimeoutErrorRetries: 0
      RateLimitErrorRetries: 1
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
      NotFoundErrorRetries: 0
      DefaultRetries: 1
    # The local vision profile gets the same policy (TASK-353): locallama-qwen-vl as the fallback of
    # strata-qwen-vl, local-qwen-vl alone. LiteLLM looks the policy up per fallback hop, so without
    # these the hop used num_retries: 1 and retried a timeout: three attempts in all, past the client's
    # wait, with llama-router still reading after the client left. TimeoutErrorRetries must be set:
    # an unset field falls through to DefaultRetries (which also covers 4xx codes LiteLLM leaves
    # unmapped, such as 403 or 413).
    locallama-qwen-vl:
      InternalServerErrorRetries: 1
      ServiceUnavailableErrorRetries: 1
      TimeoutErrorRetries: 0
      RateLimitErrorRetries: 1
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
      NotFoundErrorRetries: 0
      DefaultRetries: 1
    local-qwen-vl:
      InternalServerErrorRetries: 1
      ServiceUnavailableErrorRetries: 1
      TimeoutErrorRetries: 0
      RateLimitErrorRetries: 1
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
      NotFoundErrorRetries: 0
      DefaultRetries: 1
  routing_strategy: latency-based-routing
  enable_health_check_routing: false
vector_store_settings:
  collection_name: litellm_semantic_cache
  connection_string: os.environ/DATABASE_URL
  embedding_model: locallama-nomic-embed
  store_type: postgres
