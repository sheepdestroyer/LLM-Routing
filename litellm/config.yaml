# ================================================================================
# AGENT TIER STATIC SAFETY-NET — chain-routed, one deployment per tier.
# Each tier has exactly ONE static deployment routing to the next tier up:
#   simple → medium → complex → reasoning → advanced → local-qwen
# This guarantees no tier is ever empty (prevents ModelNotFoundError on
# cold start) while avoiding redundant fallback loops — only advanced-core
# points directly to the local classifier. The dynamic roster sync
# (router/main.py) adds OpenRouter deployments on top at startup.
# ================================================================================

- model_name: agent-advanced-core
  litellm_params:
    api_base: LLAMA_SERVER_URL_PLACEHOLDER
    api_key: local-token
    model: openai/local-qwen
    request_timeout: 120
  model_info:
    mode: chat
    max_tokens: 240896
    max_input_tokens: 240896
    supports_function_calling: true
    supports_reasoning: true
    supports_vision: true
    is_public_model_group: true
- model_name: agent-reasoning-core
  litellm_params:
