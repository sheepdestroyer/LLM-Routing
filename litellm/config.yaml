general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
litellm_settings:
  # -------------------------------------------------------------------------
  # FALLBACK CHAINS (cascading, in order of escalation)
  # Simple → medium → complex → reasoning → advanced → locallama-qwen → ollama → openrouter-auto
  # -------------------------------------------------------------------------
  cache: true
  cache_params:
    host: 127.0.0.1
    mode: default
    port: VALKEY_CACHE_PORT_PLACEHOLDER
    ttl: 3600
    type: redis
  caching_backend: redis
  callbacks:
  - langfuse
  detailed_debug: false
  drop_params: true
  public_model_groups:
    - locallama-qwen
    - locallama-qwen-hass
    - locallama-qwen-routing
    - locallama-whisper
    - locallama-nomic-embed
    - agy-gemini
    - agy-gemini-sse
    - agy-opus
    - agy-opus-sse
    - agy-sonnet
    - agy-sonnet-sse
    - agy-gptoss
    - agy-gptoss-sse
    - ollama-deepseek-v4-pro
    - ollama-deepseek-v4-flash
    - ollama-gpt-5.6-luna
    - ollama-gpt-5.6-luna-max
    - openrouter-auto
    - openrouter-gpt-5.6-luna
    - openrouter-gpt-5.6-luna-max
    - openrouter-tts
    - agent-advanced-core
    - agent-reasoning-core
    - agent-complex-core
    - agent-medium-core
    - agent-simple-core
    # Legacy aliases
    - local-qwen
    - local-qwen-hass
    - local-qwen-routing
    - whisper-1
    - gpt-4o-mini-transcribe
    - gpt-4o-mini-tts
    - tts-1
    - llm-routing-agy
    - llm-routing-agy-sse
    - agy-sse
    - gpt-4o-mini
    - gpt-4o
  fallbacks:
  - agy-gemini:
    - agy-opus
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agy-gemini-sse:
    - agy-opus-sse
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - llm-routing-agy:
    - agy-opus
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - llm-routing-agy-sse:
    - agy-opus-sse
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agy-sse:
    - agy-opus-sse
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agy-opus:
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agy-opus-sse:
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agent-simple-core:
    - agent-medium-core
    - agent-complex-core
    - agent-reasoning-core
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agent-medium-core:
    - agent-complex-core
    - agent-reasoning-core
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agent-complex-core:
    - agent-reasoning-core
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agent-reasoning-core:
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agent-advanced-core:
    - locallama-qwen
    - ollama-deepseek-v4-pro
    - openrouter-auto

# ================================================================================
# MINIMAL SAFETY-NET BOOTSTRAP MODEL LIST
# Primary model deployments are dynamically synchronized and managed in the
# PostgreSQL database (LiteLLM_ProxyModelTable) via router/model_sync.py.
# This static bootstrap guarantees that core local fallbacks exist immediately
# upon cold start before DB synchronization completes.
# ================================================================================
model_list:
- litellm_params:
    api_base: LLAMA_SERVER_URL_PLACEHOLDER
    api_key: local-token
    model: openai/local-qwen
    extra_body:
      chat_template_kwargs:
        preserve_thinking: true
    request_timeout: 600
  model_name: locallama-qwen
  model_info:
    supports_vision: true
    supports_reasoning: true
    supports_function_calling: true
    mode: chat
    max_tokens: 240896
    max_input_tokens: 240896
    is_public_model_group: true

- litellm_params:
    api_base: LLAMA_SERVER_URL_PLACEHOLDER
    api_key: local-token
    model: openai/local-qwen
