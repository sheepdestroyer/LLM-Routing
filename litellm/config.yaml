general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
litellm_settings:
  # -------------------------------------------------------------------------
  # FALLBACK CHAINS (cascading, in order of escalation)
  # Simple → medium → complex → reasoning → advanced → locallama-qwen → ollama → openrouter-auto
  # -------------------------------------------------------------------------
  cache: true
  cache_params:
    host: 127.0.0.1
    mode: default
    port: VALKEY_CACHE_PORT_PLACEHOLDER
    ttl: 3600
    type: redis
  caching_backend: redis
  callbacks:
  - langfuse
  detailed_debug: false
  drop_params: true
  public_model_groups:
    - locallama-qwen
    - local-qwen
    - locallama-qwen-hass
    - local-qwen-hass
    - locallama-qwen-routing
    - local-qwen-routing
    - locallama-qwen-vl
    - local-qwen-vl
    - locallama-whisper
    - whisper-1
    - locallama-nomic-embed
    - local-nomic-embed
    - agy-gemini
    - agy-gemini-sse
    - agy-opus
    - agy-opus-sse
    - agy-sonnet
    - agy-sonnet-sse
    - agy-gptoss
    - agy-gptoss-sse
    - llm-routing-agy
    - llm-routing-agy-sse
    - agy-sse
    - ollama-deepseek-v4-pro
    - ollama-deepseek-v4-flash
    - openrouter-auto
    - openrouter-gpt-5.6-luna
    - openrouter-gpt-5.6-luna-max
    - agent-advanced-core
    - agent-reasoning-core
    - agent-complex-core
    - agent-medium-core
    - agent-simple-core
    - gpt-4o-mini
    - gpt-4o
    - strata-qwen
    - locallama-strata
    - gb10-strata
    - strata-qwen-vl
  fallbacks:
  - llm-routing-agy:
    - agy-opus
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - llm-routing-agy-sse:
    - agy-opus-sse
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agy-sse:
    - agy-opus-sse
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - local-qwen:
    - locallama-qwen
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agy-gemini:
    - strata-qwen
    - locallama-qwen
  # strata-qwen (GX10 LAN) falls back to the LOCAL llama-router only. locallama-qwen is the
  # same llama-router preset as local-qwen (alias of [Qwen3.8-27B-spec], sampling from
  # model_presets.ini) but, unlike local-qwen, has no fallbacks of its own: LiteLLM follows
  # the fallbacks of a fallback target, and local-qwen escalates to Ollama/OpenRouter (cloud).
  # Security-log analysis must never leave the LAN.
  - strata-qwen:
    - locallama-qwen
  # strata-qwen-vl: the canonical vision/OCR route (TASK-353, owner decision 2026-10-30).
  # Qwen3.8-Flash-Next on Strata (GX10) first, then ONLY locallama-qwen-vl: the vision alias of
  # the single llama-router preset [Qwen3.8-27B-spec] (mmproj on), sent with thinking on and the
  # vl sampling defaults set on that deployment (AGENTS.md L1 exception). Case pages must never
  # leave the LAN: locallama-qwen-vl / local-qwen-vl have no fallbacks of their own.
  - strata-qwen-vl:
    - locallama-qwen-vl
  - agy-gemini-sse:
    - agy-opus-sse
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agy-opus:
    - agy-gemini
    - strata-qwen
    - locallama-qwen
  - agy-opus-sse:
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agent-simple-core:
    - agent-medium-core
    - agent-complex-core
    - agent-reasoning-core
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agent-medium-core:
    - agent-complex-core
    - agent-reasoning-core
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agent-complex-core:
    - agent-reasoning-core
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agent-reasoning-core:
    - agent-advanced-core
    - ollama-deepseek-v4-pro
    - openrouter-auto
  - agent-advanced-core:
    - locallama-qwen
    - ollama-deepseek-v4-pro
    - openrouter-auto

# ================================================================================
# MINIMAL SAFETY-NET BOOTSTRAP MODEL LIST
# Primary model deployments are dynamically synchronized and managed in the
# PostgreSQL database (LiteLLM_ProxyModelTable) via router/model_sync.py.
# This static bootstrap guarantees that core local fallbacks exist immediately
# upon cold start before DB synchronization completes.
# ================================================================================
model_list:
- litellm_params:
    api_base: LLAMA_SERVER_URL_PLACEHOLDER
    api_key: local-token
    model: openai/locallama-qwen
    extra_body:
      chat_template_kwargs:
        preserve_thinking: true
    request_timeout: 600
  model_name: locallama-qwen
  model_info:
    supports_vision: true
    supports_reasoning: true
    supports_function_calling: true
    mode: chat
    max_tokens: 240896
    max_input_tokens: 240896
    is_public_model_group: true

- litellm_params:
    api_base: LLAMA_SERVER_URL_PLACEHOLDER
    api_key: local-token
    model: openai/locallama-qwen
    extra_body:
