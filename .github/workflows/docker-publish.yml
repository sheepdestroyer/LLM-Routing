name: Build and Push Docker Image

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v0.1.101)
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: rel
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          VER="${TAG#v}"
          MINOR="${VER%.*}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Downcase Repository Name
        run: |
          echo "IMAGE_NAME=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.rel.outputs.tag }}
            type=raw,value=${{ steps.rel.outputs.ver }}
            type=raw,value=${{ steps.rel.outputs.minor }}
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: router
          file: router/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Package deployment bundle and attach to release
        if: github.event_name == 'release' || github.event_name == 'workflow_call' || startsWith(github.ref, 'refs/tags/v')
        run: |
          chmod +x scripts/package_release.sh
          ./scripts/package_release.sh llm-routing-deploy.tar.gz
          gh release upload "$REF_NAME" llm-routing-deploy.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ steps.rel.outputs.tag }}
