name: Run Tests

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install httpx==0.28.1 pytest pytest-asyncio anyio pyyaml fastapi "pydantic>=2.0,<3.0" uvicorn python-multipart asyncpg langfuse redis aiofiles==25.1.0 jinja2 orjson playwright
          playwright install --with-deps chromium

      - name: Run Unit Tests
        run: CONFIG_PATH=router/config.yaml PYTHONPATH=. pytest --ignore=tests/test_agy_behavior.py --ignore=tests/test_agy_tiers.py --ignore=tests/test_antigravity.py --ignore=router/tests/test_agy_proxy.py --ignore=tests/test_host_agy_daemon.py

      - name: Run Breaker Verification
        run: PYTHONPATH=. python3 scripts/verification/verify_breaker.py

      - name: Run Integration Verification
        run: PYTHONPATH=. python3 tests/test_a2_verify.py
