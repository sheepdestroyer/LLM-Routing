name: Run Tests

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          pip install httpx==0.28.1 pytest pytest-asyncio pytest-xdist anyio pyyaml fastapi "pydantic>=2.0,<3.0" uvicorn python-multipart asyncpg langfuse redis aiofiles==25.1.0 jinja2 orjson playwright ruff mypy pytest-cov coverage
          playwright install --with-deps chromium

      - name: Run Ruff Lint & Format Check
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Check
        run: |
          mypy

      - name: Run Unit Tests with 100% Coverage Gate
        run: |
          CONFIG_PATH=router/config.yaml PYTHONPATH=".:scripts" pytest --cov=router --cov=host_agy_daemon --cov-branch --cov-report=term-missing --cov-fail-under=100

      - name: Run Breaker Verification
        run: PYTHONPATH=. python3 scripts/verification/verify_breaker.py

      - name: Run Integration Verification
        run: PYTHONPATH=. python3 tests/test_a2_verify.py
