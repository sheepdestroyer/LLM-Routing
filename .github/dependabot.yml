updates:
  # Container image scanning for YAML manifests (pod.yaml, k8s manifests, helm values, etc.)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "02:55"
    open-pull-requests-limit: 50
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "sheepdestroyer"
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "ROUTER_IMAGE_PLACEHOLDER"
    groups:
      langfuse:
        patterns:
          - "langfuse/langfuse"
          - "langfuse/langfuse-worker"
      valkey:
        patterns:
          - "valkey/valkey"
    cooldown:
      default:
        semver-major: 0
        semver-minor: 0
        semver-patch: 0


  # Dockerfiles (keeps Dockerfile FROM lines updated)
  - package-ecosystem: "docker"
    directory: "router/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 50
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "sheepdestroyer"

  # GitHub Actions workflow updates (optional)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 50
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "sheepdestroyer"

# Notes:
# - Create repository secrets with names used above when using private registries:
#   GHCR_USERNAME, GHCR_TOKEN, DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#   (Settings → Secrets and variables → Actions → New repository secret)
# - The 'container' ecosystem scans YAML/Helm/other manifests for `image:` keys and will
#   update the tag or digest portion when newer versions are available on the registry.
# - Dependabot will NOT update images that are local-only (e.g., localhost/llm-triage-router).
